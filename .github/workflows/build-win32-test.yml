name: Build Win32 x64 (fix test)

on:
  push:
    branches: [fix/307333-runcommands-accept]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Add signtool to PATH
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          if (-not $signtool) { $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source }
          if (-not $signtool) { Write-Output "signtool not found"; exit 1 }
          Write-Output $signtool
          Add-Content $env:GITHUB_PATH $signtool

      - name: npm ci
        run: npm ci --no-audit

      - name: Build vscode-win32-x64
        run: node node_modules/gulp/bin/gulp.js vscode-win32-x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Move build output into workspace
        shell: pwsh
        run: Move-Item "..\VSCode-win32-x64" "VSCode-win32-x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-win32-x64-fix-307333
          path: VSCode-win32-x64
          retention-days: 14
          if-no-files-found: error
